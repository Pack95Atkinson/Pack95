name: Build and Deploy Tailwind
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Tailwind
        run: npm install -D tailwindcss @tailwindcss/cli

      - name: Build CSS
        run: npx @tailwindcss/cli -i ./src/input.css -o ./__site/assets/css/styles.css --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './__site'

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
